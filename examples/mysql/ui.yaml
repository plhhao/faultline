api_version: faultline/v1alpha1
runtime:
  max_inflight_requests: 100
  request_timeout: 30s
proxies:
  - id: database
    protocol: postgresql
    listen: 127.0.0.1:15432
    upstream: postgresql://127.0.0.1:5432
    rules:
      - id: lost-commit-ack
        enabled: true
        match: {}
        select: {probability: 1}
        fault:
          phase: after_commit
          action: close_connection
  - id: payment
    protocol: http1
    listen: 127.0.0.1:18080
    upstream: http://127.0.0.1:9000
    rules:
      - id: payment-fault
        match:
          path: /healthz
        select:
          probability: 0
        fault:
          action: respond
          phase: before_upstream_request
          status: 503
          body: Injected by Faultline
      - id: payment-detail
        enabled: false
        match:
          path_pattern: /payment/:id
        select:
          probability: 1
        fault:
          action: respond
          phase: before_upstream_request
          status: 503
          body: Path pattern matched
  - id: echo
    protocol: grpc
    listen: 127.0.0.1:18081
    upstream: http://127.0.0.1:9001
    rules:
      - id: echo-delay
        select:
          probability: 0
        fault:
          action: delay
          phase: before_upstream_request
          duration: 2s

  - id: mysql
    protocol: mysql
    listen: 127.0.0.1:13306
    upstream: mysql://127.0.0.1:3306
    rules:
      - id: lost-commit-ack
        enabled: true
        match: {}
        select: {probability: 0}
        fault: {action: close_connection, phase: after_commit}
