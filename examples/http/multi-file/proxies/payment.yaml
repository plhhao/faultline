proxies:
  - id: payment
    protocol: http1
    listen: 127.0.0.1:8080
    upstream: http://127.0.0.1:9000
    rules:
      - id: payment-lost-response
        enabled: true
        match:
          method: POST
          path: /payments
        select:
          probability: 0.2
        fault:
          phase: after_upstream_headers
          action: hold_response
          max_duration: 10s
