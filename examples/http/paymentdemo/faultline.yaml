api_version: faultline/v1alpha1
seed: 42
runtime:
  max_inflight_requests: 32
  request_timeout: 5s
proxies:
  - id: payment
    protocol: http1
    listen: 127.0.0.1:8080
    upstream: http://127.0.0.1:9000
    rules:
      - id: lost-response
        match: {method: POST, path: /payments}
        select: {probability: 1}
        fault:
          action: hold_response
          phase: after_upstream_headers
          max_duration: 3s
