api_version: faultline/v1alpha1
proxies:
  - id: http2
    protocol: http2
    listen: 127.0.0.1:8080
    upstream: http://127.0.0.1:9000
    rules:
      - id: slow-download
        match: {path: /download}
        select: {probability: 1}
        fault:
          action: throttle
          direction: response
          phase: after_upstream_headers
          bytes_per_second: 65536
