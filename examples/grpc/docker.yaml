api_version: faultline/v1alpha1
proxies:
  - id: echo
    protocol: grpc
    listen: 0.0.0.0:8080
    upstream: https://host.docker.internal:9000
    tls:
      cert_file: tls/cert.pem
      key_file: tls/key.pem
      client_ca_file: tls/cert.pem
    upstream_tls:
      ca_file: tls/cert.pem
      cert_file: tls/cert.pem
      key_file: tls/key.pem
    rules:
      - id: cut-every-second-response
        match: {service: faultline.demo.Echo, method: Call}
        select: {every: 2}
        fault: {action: truncate, direction: response, phase: after_upstream_headers, bytes: 1024}
